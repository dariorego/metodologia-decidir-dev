# Publicação com Docker + Traefik.
#
# A rede, o entrypoint e o certresolver seguem a convenção já usada pelos
# demais serviços do servidor (n8n, ticketz, jurema): rede externa
# "traefik-public", entrypoint "websecure", certresolver "letsencrypt".
# O label traefik.docker.network é necessário porque o Traefik está em mais
# de uma rede e precisa saber por qual alcançar este container.
#
#   PONTO_DOMAIN=ponto.exemplo.org.br docker compose up -d --build

services:
  ponto-web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: ponto-residentes-web:latest
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    networks:
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.ponto.rule=Host(`${PONTO_DOMAIN}`)
      - traefik.http.routers.ponto.entrypoints=websecure
      - traefik.http.routers.ponto.tls.certresolver=letsencrypt
      - traefik.http.services.ponto.loadbalancer.server.port=3000

networks:
  traefik-public:
    external: true
